name: Validate RedHome

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate skills, pointers, and wiki
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout RedHome
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run validate.ps1
        shell: pwsh
        run: ./validate.ps1
